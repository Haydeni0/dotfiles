git:
  diffRenderers:
    # --features lazygit activates the [delta "lazygit"] block (hunk
    # headers omitted - the line-numbers column already carries position
    # info) and, because a command-line --features replaces delta.features
    # entirely, also opts out of the side-by-side feature: lazygit's
    # panels are narrower than a full terminal and side-by-side has known
    # width-rendering bugs there.
    - command: delta --dark --paging=never --line-numbers --features lazygit
