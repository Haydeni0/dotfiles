# External content vendored by chezmoi. Updating a plugin = change the rev in
# its URL + its checksum, then `chezmoi apply`. Paths MUST match the source
# guards in the zshrc. (Archive externals, not git-repos: chezmoi has no rev
# pinning for git-repos - only clone/pull. Checksums pin the exact content.)
# The NvChad starter is NOT here: it is a user-mutable base the install
# script clones once (externals would overwrite local edits on every apply).

[".local/share/zsh/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5.tar.gz"
    exact = true
    stripComponents = 1
    checksum.sha256 = "20665e469e720e674964a66854d5534b9af78cdfd438512746ecd1ade8e819ce"

[".local/share/zsh/zsh-syntax-highlighting"]
