onboarding = false

[terminal]
default_shell = "ZSH_PATH_PLACEHOLDER"
shell_mode = "non_login"

[keys]
prefix = "ctrl+space"
detach = "prefix+d"

[theme]
name = "THEME_PLACEHOLDER"
auto_switch = false

[ui.sound]
enabled = false

[ui]
show_agent_labels_on_pane_borders = false
tab_bar_right = [{ type = "command", command = "~/.config/herdr/agent-gates.sh", interval_seconds = 2, timeout_seconds = 2 }]

# Sidebar workspace rows: prefix each space with its ordinal ($num token,
# maintained by the linked numbered-workspaces plugin). Declaring rows replaces
# the default layout, so the built-ins are repeated here.
[ui.sidebar.spaces]
rows = [["$num", "state_icon", "workspace"], ["branch", "git_status"]]
